name: Continuous Deployment

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Cosign keyless signing
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]
        include:
          - service: frontend
            dockerfile: "robot trader/Dockerfile.frontend"
          - service: backend-ml
            dockerfile: "robot trader/server/Dockerfile.backend-ml"
          - service: backend-proxy
            dockerfile: "server/Dockerfile.backend-proxy"
    steps:
    - uses: actions/checkout@v4

    - name: Compute lowercase image repository
      run: |
        echo "IMAGE_REPOSITORY=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # All Dockerfiles expect the repository root as build context so they can
    # COPY the npm workspace manifests; builds run `npm ci` against the
    # committed root package-lock.json for reproducible images.
    - name: Build and Push Image
      id: build-and-push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
        cache-to: type=gha,mode=max

    - name: Generate SBOM (Syft)
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
        format: spdx-json
        output-file: ${{ matrix.service }}-sbom.spdx.json

    - name: Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
        format: 'table'
        exit-code: '1' # Fail pipeline on CRITICAL
        severity: 'CRITICAL,HIGH'

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign Image
      run: cosign sign --yes ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}@${{ steps.build-and-push.outputs.digest }}
