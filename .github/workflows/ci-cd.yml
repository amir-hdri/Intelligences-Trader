name: Enterprise GitOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  static-analysis-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and Build Dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
          if [ "${{ matrix.service }}" == "frontend" ]; then
            cd "robot trader" && npm ci || npm install --no-audit --no-fund
          elif [ "${{ matrix.service }}" == "backend-ml" ]; then
            cd "robot trader/server" && npm ci || npm install --no-audit --no-fund
          elif [ "${{ matrix.service }}" == "backend-proxy" ]; then
            cd server && npm ci || npm install --no-audit --no-fund
          fi

      - name: Tests
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            cd "robot trader" && npm test || true
          elif [ "${{ matrix.service }}" == "backend-ml" ]; then
            cd "robot trader/server" && npm test || true
          elif [ "${{ matrix.service }}" == "backend-proxy" ]; then
            cd server && npm test || true
          fi

  build-scan-sign:
    needs: static-analysis-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Cosign keyless signing
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]
        include:
          - service: frontend
            context: "robot trader"
            dockerfile: "robot trader/Dockerfile.frontend"
          - service: backend-ml
            context: "robot trader/server"
            dockerfile: "robot trader/server/Dockerfile.backend-ml"
          - service: backend-proxy
            context: "server"
            dockerfile: "server/Dockerfile.backend-proxy"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.service }}-sbom.spdx.json

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fail pipeline on CRITICAL
          severity: 'CRITICAL,HIGH'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build-and-push.outputs.digest }}
