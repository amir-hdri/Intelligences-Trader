name: Enterprise GitOps CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: |
        npm install --no-audit --no-fund
        cd "robot trader/server" && npm install --no-audit --no-fund --force
        cd ../../server && npm install --no-audit --no-fund

    - name: Run Tests
      run: npm test

    - name: Security Scan (npm audit)
      run: |
        npm audit --audit-level=high || true
        cd "robot trader/server" && npm audit --audit-level=high || true
        cd ../../server && npm audit --audit-level=high || true

  docker-build:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Regenerate lock files
      run: |
        cd "robot trader/server"
        rm -f package-lock.json
        npm install --no-audit --no-fund

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/intelligences-trader-${{ matrix.service }}:latest
