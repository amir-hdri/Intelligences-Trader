name: Enterprise GitOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Run Tests
      run: npm test --workspaces --if-present

    - name: Security Scan (npm audit)
      run: npm audit --audit-level=high || true

  docker-build:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Cosign keyless signing
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]
        include:
          - service: frontend
            context: "robot trader"
            dockerfile: "robot trader/Dockerfile.frontend"
          - service: backend-ml
            context: "robot trader/server"
            dockerfile: "robot trader/server/Dockerfile.backend-ml"
          - service: backend-proxy
            context: "server"
            dockerfile: "server/Dockerfile.backend-proxy"
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Regenerate lock files
      run: |
        cd "robot trader/server"
        rm -f package-lock.json
        npm install --no-audit --no-fund

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Image
      id: build-and-push
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ github.repository | lower }}/${{ matrix.service }}:${{ github.sha }}
        cache-to: type=gha,mode=max
    
    - name: Generate SBOM (Syft)
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ github.repository | lower }}/${{ matrix.service }}:${{ github.sha }}
        format: spdx-json
        output-file: ${{ matrix.service }}-sbom.spdx.json

    - name: Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository | lower }}/${{ matrix.service }}:${{ github.sha }}
        format: 'table'
        exit-code: '1' # Fail pipeline on CRITICAL
        severity: 'CRITICAL,HIGH'

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign Image
      run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository | lower }}/${{ matrix.service }}@${{ steps.build-and-push.outputs.digest }}
