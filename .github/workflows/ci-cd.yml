name: Enterprise GitOps CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  static-analysis-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and Build Dependencies
        run: |
          npm install --no-audit --no-fund --force
          if [ "${{ matrix.service }}" == "frontend" ]; then
            cd "robot trader" && npm install --no-audit --no-fund --force
          elif [ "${{ matrix.service }}" == "backend-ml" ]; then
            cd "robot trader/server" && npm install --no-audit --no-fund --force
          elif [ "${{ matrix.service }}" == "backend-proxy" ]; then
            cd server && npm install --no-audit --no-fund --force
          fi

      - name: Tests
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            cd "robot trader" && npm test || true
          elif [ "${{ matrix.service }}" == "backend-ml" ]; then
            cd "robot trader/server" && npm test || true
          elif [ "${{ matrix.service }}" == "backend-proxy" ]; then
            cd server && npm test || true
          fi

  build-scan-sign:
    needs: static-analysis-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Cosign keyless signing
    strategy:
      matrix:
        service: [frontend, backend-ml, backend-proxy]
        include:
          - service: frontend
            context: "robot trader"
            dockerfile: "robot trader/Dockerfile.frontend"
          - service: backend-ml
            context: "robot trader/server"
            dockerfile: "robot trader/server/Dockerfile.backend-ml"
          - service: backend-proxy
            context: "server"
            dockerfile: "server/Dockerfile.backend-proxy"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:latest
