version: '3.8'

services:
  frontend:
    build:
      context: ./robot trader
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-ml
      - backend-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-ml:
    build:
      context: ./robot trader/server
      dockerfile: Dockerfile.backend-ml
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    secrets:
      - master_encryption_key
      - jwt_secret
      - refresh_secret
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend-proxy:
    build:
      context: ./server
      dockerfile: Dockerfile.backend-proxy
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    secrets:
      - jwt_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

secrets:
  master_encryption_key:
    file: ./secrets/master_encryption_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  refresh_secret:
    file: ./secrets/refresh_secret.txt
