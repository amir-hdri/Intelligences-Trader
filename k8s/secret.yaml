# Template for the secrets referenced by deployment.yaml (envFrom).
#
# NEVER commit real values. Two supported ways to provision:
#
#   1) Fill in the placeholders below and apply once:
#        kubectl apply -f k8s/secret.yaml
#
#   2) Create it directly from local values (preferred):
#        kubectl create secret generic kalaybot-secrets \
#          --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#          --from-literal=REFRESH_SECRET="$(openssl rand -hex 32)" \
#          --from-literal=ADMIN_USERNAME="admin" \
#          --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#          --from-literal=MASTER_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#          --from-literal=DATABASE_URL="" \
#          --from-literal=REDIS_URL=""
#
# DATABASE_URL / REDIS_URL are optional: leave them empty (or omit the keys)
# to run on the built-in in-memory fallbacks; set them when a PostgreSQL /
# Redis instance is reachable from the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: kalaybot-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_32PLUS_CHAR_SECRET"
  REFRESH_SECRET: "REPLACE_WITH_32PLUS_CHAR_SECRET"
  ADMIN_USERNAME: "REPLACE_ME"
  ADMIN_PASSWORD: "REPLACE_ME"
  MASTER_ENCRYPTION_KEY: "REPLACE_WITH_32PLUS_CHAR_KEY"
  DATABASE_URL: ""
  REDIS_URL: ""
