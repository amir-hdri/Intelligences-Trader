[project]
name = "intelligences-trader-ml"
version = "0.2.0"
description = "Research-grade PPO/TCN pipeline and independent trading safety controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2",
    "hmmlearn>=0.3.2,<0.4",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
    "pandas>=2.2,<4",
    "pytest>=8,<10",
]

[project.optional-dependencies]
training = [
    "onnx>=1.17,<2",
    "onnxscript>=0.2,<1",
    "torch>=2.13.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers"
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:hmmlearn.*",
]
